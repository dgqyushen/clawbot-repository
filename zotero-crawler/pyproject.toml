[project]
name = "zotero-crawler"
version = "0.2.0"
description = "Automated Si-C anode literature tracking for Zotero"
authors = [{name = "OpenClaw"}]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "pyzotero>=1.5.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "loguru (>=0.7.3,<0.8.0)",
]

[tool.poetry]
packages = [{include = "src"}]

[tool.poetry.scripts]
zotero-crawler = "daily_run:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"