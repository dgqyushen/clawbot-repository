# Si-C Anode Keywords Configuration
# Used by zotero-crawler for targeted literature search
# Only Si-C anode related keywords - no sodium-ion or unrelated topics

topic: si-c-anode
name: "Si-C Anode"
description: "Silicon-Carbon composite anodes for lithium-ion batteries"

# Primary keywords - must be specific to Si-C anodes
primary_keywords:
  - "silicon carbon anode"
  - "Si-C composite anode" 
  - "silicon carbon battery"
  - "Si/C anode"
  - "silicon anode"
  - "Si/C composite"
  - "silicon carbon lithium"
  - "Si-C lithium ion"
  - "silicon carbon composite"
  - "Si-graphite anode"

# Secondary keywords - broader context but still relevant
secondary_keywords:
  - "solid electrolyte interphase silicon"
  - "SEI stabilization silicon anode"
  - "silicon nanowire anode"
  - "porous silicon anode"
  - "silicon nanoparticle anode"
  - "silicon thin film anode"

# Excluded keywords - explicitly filter out unrelated topics
excluded_keywords:
  # 其他电池体系
  - "sodium"  
  - "sodium-ion"
  - "sodium ion"
  - "Na-ion" 
  - "Na ion"
  - "potassium"
  - "potassium ion"
  - "aluminum ion"
  - "magnesium"
  - "calcium"
  - "Alluaudite"
  - "Prussian white"
  - "iron sulfate"
  # 环境电化学（使用阳极做降解）
  - "tetracycline"
  - "degradation"
  - "wastewater"
  - "pollutant"
  - "contaminant"
  - "electrocatalytic degradation"
  - "electrochemical oxidation"
  - "advanced oxidation"
  - "chlorinated byproducts"
  - "disinfection"
  - "organic pollutant"
  - "pharmaceutical"
  - "antibiotic"
  - "dye"
  - "ROS generation"
  - "reactive oxygen species"
  - "electro-Fenton"
  # 电池管理系统/热管理（非材料研究）
  - "thermal management"
  - "battery thermal"
  - "cooling system"
  - "heat dissipation"
  - "battery management system"
  - "state of charge"
  - "state of health"
  - "SOC estimation"
  - "SOH estimation"
  # 其他无关领域
  - "electrocatalytic"
  - "hydrogen evolution"
  - "oxygen evolution"
  - "water splitting"
  - "CO2 reduction"
  - "nitrogen reduction"
  - "fuel cell"
  - "supercapacitor"
  # 非硅碳负极材料（明确排除锌、钨、锡氧化物等）
  - "zinc"
  - "zinc-ion"
  - "zinc anode"
  - "tungsten"
  - "tin oxide"
  - "SnO"
  - "TiO2"
  - "iron oxide"
  - "Fe3O4"
  - "cobalt"
  - "Co3O4"
  - "nickel"
  - "manganese"
  - "MnO"
  - "MnO2"
  - "vanadium"
  - "molybdenum"
  - "MoS2"
  - "graphite anode"
  - "hard carbon"
  - "soft carbon"
  - "graphene anode" - 放宽到IF>7
min_impact_factor: 7.0
required_venues: []

# 期刊白名单文件路径（使用扩展白名单，包含二区优质期刊）
whitelist_file: "config/keywords/journal-whitelist-extended.yaml"

# 排除的期刊 - 仅排除明显不相关的领域
excluded_venues:
  - "IEEE Transactions on Power Electronics"  # 偏工程/电力电子
  - "International Journal of Energy Research"  # 偏工程
  - "Science of The Total Environment"  # 偏环境科学
  - "Chemosphere"  # 环境化学
  - "Journal of Environmental Chemical Engineering"  # 环境工程
  - "Tetracycline"  # 药物
  - "Water Research"  # 水处理

# Semantic Scholar search settings
search:
  max_results_per_keyword: 20
  sort_by: "publicationDate"
  min_year: 2020
  days_back: 7
  # 严格模式: 只搜索必须同时包含silicon和anode的精确短语
  strict_mode: true
  # 要求论文标题/摘要必须同时包含以下词汇组合
  required_combinations:
    - ["silicon", "anode"]
    - ["silicon", "carbon"]
    - ["Si", "C"]
    - ["Si-C", "battery"]
  # 排除标题中含有这些词的论文
  title_excluded:
    - "tetracycline"
    - "degradation"
    - "wastewater"
    - "pollutant"
    - "thermal management"
    - "cooling"
    - "supercapacitor"

# Rate limiting (Semantic Scholar: 1 req/sec)
rate_limit_rps: 1.0
