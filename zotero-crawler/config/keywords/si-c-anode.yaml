# Si-C Anode Keywords Configuration
# Used by zotero-crawler for targeted literature search
# Only Si-C anode related keywords - no sodium-ion or unrelated topics

topic: si-c-anode
name: "Si-C Anode"
description: "Silicon-Carbon composite anodes for lithium-ion batteries"

# Primary keywords - must be specific to Si-C anodes
primary_keywords:
  - "silicon carbon anode"
  - "Si-C composite anode" 
  - "silicon carbon battery"
  - "Si/C anode"
  - "silicon anode"
  - "Si/C composite"
  - "silicon carbon lithium"
  - "Si-C lithium ion"
  - "silicon carbon composite"
  - "Si-graphite anode"

# Secondary keywords - broader context but still relevant
secondary_keywords:
  - "solid electrolyte interphase silicon"
  - "SEI stabilization silicon anode"
  - "silicon nanowire anode"
  - "porous silicon anode"
  - "silicon nanoparticle anode"
  - "silicon thin film anode"

# Excluded keywords - explicitly filter out unrelated topics
excluded_keywords:
  - "sodium"  # Na-ion batteries
  - "sodium-ion"  # Na-ion batteries
  - "sodium ion"
  - "Na-ion" 
  - "Na ion"
  - "potassium"  # K-ion batteries
  - "potassium ion"
  - "aluminum ion"  # Al-ion batteries
  - "magnesium"  # Mg-ion batteries
  - "calcium"  # Ca-ion batteries
  - "Alluaudite"  # Na-ion cathode material
  - "Prussian white"  # Na-ion cathode
  - "iron sulfate"  # Na-ion related
  - "thermal management"  # Not material-specific
  - "battery management system"  # BMS, not materials
  - "state of charge"  # SOC estimation
  - "state of health"  # SOH estimation
  - "tetracycline"  # Pharmaceutical
  - "degradation"  # Environmental, not battery
  - "wastewater"  # Environmental
  - "electrocatalytic"  # Catalysis, not batteries
  - "ROS generation"  # Reactive oxygen species
  - "chlorinated byproducts"  # Environmental chemistry

# Minimum quality requirements - 放宽到IF>7
min_impact_factor: 7.0
required_venues: []

# 期刊白名单文件路径（使用扩展白名单，包含二区优质期刊）
whitelist_file: "config/keywords/journal-whitelist-extended.yaml"

# 排除的期刊 - 仅排除明显不相关的领域
excluded_venues:
  - "IEEE Transactions on Power Electronics"  # 偏工程/电力电子
  - "International Journal of Energy Research"  # 偏工程
  - "Science of The Total Environment"  # 偏环境科学
  - "Chemosphere"  # 环境化学
  - "Journal of Environmental Chemical Engineering"  # 环境工程
  - "Tetracycline"  # 药物
  - "Water Research"  # 水处理

# Semantic Scholar search settings
search:
  max_results_per_keyword: 20
  sort_by: "publicationDate"
  min_year: 2020
  days_back: 7

# Rate limiting (Semantic Scholar: 1 req/sec)
rate_limit_rps: 1.0
