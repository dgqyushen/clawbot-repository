# Generic Literature Crawler Configuration
# 
# This is a template configuration file. To use:
# 1. Copy this file to create a topic-specific config (e.g., battery-research.yaml)
# 2. Fill in your API keys
# 3. Define your search keywords
# 4. Run: python scripts/daily_crawl.py --config your-config.yaml

# Search topics - each will be queried against Semantic Scholar
# Organize by priority or category as needed
keywords:
  primary: []
  secondary: []
  # Example:
  # primary:
  #   - "machine learning"
  #   - "deep learning"
  # secondary:
  #   - "neural networks"
  #   - "transformer"

# Search settings
search:
  # Fields to fetch from API
  fields:
    - "title"
    - "authors"
    - "year"
    - "citationCount"
    - "publicationDate"
    - "journal"
    - "abstract"
    - "externalIds"
    - "openAccessPdf"
    - "s2FieldsOfStudy"
    - "tldr"
  
  # Result limits per keyword
  max_results_per_keyword: 10
  
  # Sort by: citationCount, publicationDate, relevance
  sort_by: "publicationDate"
  
  # Minimum year (e.g., only papers from 2020 onward)
  min_year: 2020

# Deduplication settings
deduplication:
  # Primary key for deduplication: DOI, or fallback to title hash
  primary_key: "doi"
  
  # Also check title similarity to catch papers without DOI
  title_similarity_threshold: 0.9

# Zotero export settings
zotero:
  # Target collection name (will be created if not exists)
  target_collection: "Literature Crawler"
  
  # Tag all imported papers
  tags:
    - "auto-import"
    - "crawler"
  
  # Add citation count as note
  add_citation_note: true

# Notification settings
notification:
  # Bark device key for notifications
  bark_key: ""
  
  # Bark server URL
  bark_url: "https://api.day.app"
  
  # Max papers to include in notification detail
  max_detail_papers: 5

# API Keys (REQUIRED - fill these in)
api_keys:
  semantic_scholar: ""  # Get from https://www.semanticscholar.org/product/api
  zotero:
    library_id: ""        # Your Zotero user ID
    api_key: ""          # Your Zotero API key
    library_type: "user" # "user" or "group"
