# Battery Research - Si-C Anode & Na-ion Topics
# 
# Example topic-specific configuration for battery research.
# Usage:
#   python scripts/daily_crawl.py --config config/topics/battery-research.yaml

# Inherit from template and override
keywords:
  primary:
    - "silicon-carbon anode"
    - "Si-C composite anode"
    - "silicon carbon battery"
    - "sodium iron sulfate"
    - "Alluaudite cathode"
    - "Na-ion battery cathode"
  
  secondary:
    - "solid electrolyte interphase silicon"
    - "SEI stabilization silicon anode"
    - "high capacity anode material"
    - "conversion reaction battery"
    - "iron-based cathode"

search:
  max_results_per_keyword: 10
  sort_by: "publicationDate"
  min_year: 2020

zotero:
  target_collection: "Battery Research Auto-Import"
  tags:
    - "battery"
    - "auto-import"
    - "crawler"

notification:
  # Bark device key - set via BARK_KEY environment variable or config/local.yaml
  # Get from Bark app: Settings -> Device Key
  bark_key: "${BARK_KEY}"
  bark_url: "https://bark.deepthinks.org"
  max_detail_papers: 5

api_keys:
  # Semantic Scholar API Key - set via SEMANTIC_SCHOLAR_API_KEY env var
  # Get from: https://www.semanticscholar.org/product/api
  semantic_scholar: "${SEMANTIC_SCHOLAR_API_KEY}"
  
  # Zotero API credentials - set via ZOTERO_API_KEY, ZOTERO_LIBRARY_ID env vars
  # Get from: https://www.zotero.org/settings/keys
  zotero:
    library_id: "${ZOTERO_LIBRARY_ID}"
    api_key: "${ZOTERO_API_KEY}"
    library_type: "${ZOTERO_LIBRARY_TYPE:-user}"
